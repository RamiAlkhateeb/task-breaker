name: Build and test

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test IdeaSplit.Tests

      - name: Test the AI function
        run: node --test tests/functions/*.test.mjs

      - name: Publish WASM app
        run: dotnet publish IdeaSplit.Web/IdeaSplit.Web.csproj -c Release -o publish
