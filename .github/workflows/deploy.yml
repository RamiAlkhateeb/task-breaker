name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Task-Breaker-Environment
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish WASM app
        run: dotnet publish IdeaSplit.Web/IdeaSplit.Web.csproj -c Release -o publish

      - name: Deploy to Cloudflare Pages
        env:
          WRANGLER_LOG: debug
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # This prints the exact Pages projects available to the configured token.
          
          npx --yes wrangler@4 pages deploy publish/wwwroot --project-name=task-breaker
