name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Task-Breaker-Environment
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish WASM app
        run: dotnet publish IdeaSplit.Web/IdeaSplit.Web.csproj -c Release -o publish

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        env:
          WRANGLER_LOG: debug
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # The list command logs the exact project names accessible to this token.
          command: |
            pages project list
            pages deploy publish/wwwroot --project-name=ideasplit
